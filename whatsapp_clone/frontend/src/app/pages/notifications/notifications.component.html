<div class="dashboard-layout">
  <app-navbar></app-navbar>

  <div class="container-fluid">
    <div class="row">
      <aside class="col-lg-2 d-none d-lg-block sidebar-col">
        <div class="sticky-top" style="top: 70px;">
          <app-sidebar></app-sidebar>
        </div>
      </aside>

      <main class="col-lg-10 col-md-12 main-content px-3 py-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="fw-bold mb-0">Notifications</h4>
          <button
            *ngIf="notifications.length > 0"
            class="btn btn-outline btn-sm"
            (click)="markAllAsRead()"
          >
            <i class="bi bi-check-all me-1"></i>Mark all read
          </button>
        </div>

        <!-- Loading -->
        <div *ngIf="loading">
          <app-skeleton type="notification"></app-skeleton>
          <app-skeleton type="notification"></app-skeleton>
          <app-skeleton type="notification"></app-skeleton>
        </div>

        <!-- Empty state -->
        <app-empty-state
          *ngIf="!loading && notifications.length === 0"
          icon="bi-bell-slash"
          title="No notifications"
          description="When someone interacts with your posts or profile, you will see it here."
        ></app-empty-state>

        <!-- Notification list -->
        <div *ngIf="!loading && notifications.length > 0" class="card">
          <div
            *ngFor="let notification of notifications"
            class="notification-item"
            [class.unread]="!notification.isRead"
            (click)="markAsRead(notification)"
          >
            <div class="position-relative">
              <app-avatar
                [image]="notification.sender.profileImage"
                [name]="notification.sender.fullName"
                size="md"
              ></app-avatar>
              <div
                class="position-absolute bottom-0 end-0 d-flex align-items-center justify-content-center rounded-circle bg-white"
                style="width:20px;height:20px;font-size:0.6rem;"
              >
                <i class="bi" [class]="getIcon(notification.type)" [class]="getIconColor(notification.type)"></i>
              </div>
            </div>
            <div class="flex-grow-1">
              <p class="mb-0">
                <strong>{{ notification.sender.fullName }}</strong>
                {{ notification.message }}
              </p>
              <small class="text-muted">{{ notification.createdAt | timeAgo }}</small>
            </div>
            <div *ngIf="!notification.isRead" class="rounded-circle bg-primary" style="width:8px;height:8px;"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <app-mobile-nav></app-mobile-nav>
</div>
