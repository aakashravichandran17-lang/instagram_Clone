<div class="dashboard-layout">
  <app-navbar></app-navbar>

  <div class="container-fluid">
    <div class="row">
      <aside class="col-lg-2 d-none d-lg-block sidebar-col">
        <div class="sticky-top" style="top: 70px;">
          <app-sidebar></app-sidebar>
        </div>
      </aside>

      <main class="col-lg-10 col-md-12 main-content px-3 py-3">
        <!-- Search bar -->
        <div class="card p-3 mb-3">
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0">
              <i class="bi bi-search text-muted"></i>
            </span>
            <input
              type="text"
              class="form-control border-start-0"
              placeholder="Search people by name or username..."
              [(ngModel)]="searchQuery"
              (input)="onSearch()"
            />
          </div>
        </div>

        <!-- Tabs -->
        <div class="d-flex gap-2 mb-3">
          <button
            class="btn"
            [class.btn-primary]="activeTab === 'posts'"
            [class.btn-outline]="activeTab !== 'posts'"
            (click)="activeTab = 'posts'"
          >
            <i class="bi bi-grid me-1"></i>Posts
          </button>
          <button
            class="btn"
            [class.btn-primary]="activeTab === 'people'"
            [class.btn-outline]="activeTab !== 'people'"
            (click)="activeTab = 'people'"
          >
            <i class="bi bi-people me-1"></i>People
          </button>
        </div>

        <!-- People tab -->
        <div *ngIf="activeTab === 'people'">
          <div *ngIf="searching" class="row g-3">
            <div class="col-md-6"><app-skeleton type="user"></app-skeleton></div>
            <div class="col-md-6"><app-skeleton type="user"></app-skeleton></div>
          </div>

          <app-empty-state
            *ngIf="!searching && searchQuery.length === 0"
            icon="bi-search"
            title="Search for people"
            description="Type a name or username to find people on ConnectHub."
          ></app-empty-state>

          <app-empty-state
            *ngIf="!searching && searchQuery.length > 0 && searchResults.length === 0"
            icon="bi-person-x"
            title="No results found"
            description="Try a different search term."
          ></app-empty-state>

          <div *ngIf="!searching && searchResults.length > 0" class="row g-3">
            <div *ngFor="let user of searchResults" class="col-md-6">
              <app-user-card
                [user]="user"
                (follow)="followUser($event)"
                (unfollow)="unfollowUser($event)"
              ></app-user-card>
            </div>
          </div>
        </div>

        <!-- Posts tab -->
        <div *ngIf="activeTab === 'posts'">
          <div *ngIf="loadingPosts">
            <app-skeleton type="post"></app-skeleton>
            <app-skeleton type="post"></app-skeleton>
          </div>

          <app-empty-state
            *ngIf="!loadingPosts && posts.length === 0"
            icon="bi-newspaper"
            title="No posts yet"
            description="Be the first to create a post!"
          ></app-empty-state>

          <div *ngIf="!loadingPosts && posts.length > 0">
            <app-post-card
              *ngFor="let post of posts"
              [post]="post"
              (postDeleted)="onPostDeleted($event)"
              (postUpdated)="onPostUpdated($event)"
            ></app-post-card>
          </div>
        </div>
      </main>
    </div>
  </div>

  <app-mobile-nav></app-mobile-nav>
</div>
