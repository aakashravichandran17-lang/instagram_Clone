<div class="dashboard-layout">
  <app-navbar></app-navbar>

  <div class="container-fluid">
    <div class="row">
      <!-- Left Sidebar -->
      <aside class="col-lg-2 d-none d-lg-block sidebar-col">
        <div class="sticky-top" style="top: 70px;">
          <app-sidebar></app-sidebar>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="col-lg-7 col-md-8 main-content px-3 py-3">
        <app-create-post (postCreated)="onPostCreated($event)"></app-create-post>

        <!-- Loading skeletons -->
        <div *ngIf="loading" class="mt-3">
          <app-skeleton type="post"></app-skeleton>
          <app-skeleton type="post"></app-skeleton>
          <app-skeleton type="post"></app-skeleton>
        </div>

        <!-- Empty state -->
        <app-empty-state
          *ngIf="!loading && posts.length === 0"
          icon="bi-newspaper"
          title="Your feed is empty"
          description="Follow people or create your first post to get started!"
        ></app-empty-state>

        <!-- Posts -->
        <div *ngIf="!loading && posts.length > 0" class="mt-3">
          <app-post-card
            *ngFor="let post of posts"
            [post]="post"
            (postDeleted)="onPostDeleted($event)"
            (postUpdated)="onPostUpdated($event)"
          ></app-post-card>
        </div>
      </main>

      <!-- Right Sidebar -->
      <aside class="col-lg-3 d-none d-lg-block right-sidebar-col">
        <app-right-sidebar></app-right-sidebar>
      </aside>
    </div>
  </div>

  <app-mobile-nav></app-mobile-nav>
</div>
