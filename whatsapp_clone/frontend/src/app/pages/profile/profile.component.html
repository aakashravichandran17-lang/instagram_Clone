<div class="dashboard-layout">
  <app-navbar></app-navbar>

  <div class="container-fluid">
    <div class="row">
      <aside class="col-lg-2 d-none d-lg-block sidebar-col">
        <div class="sticky-top" style="top: 70px;">
          <app-sidebar></app-sidebar>
        </div>
      </aside>

      <main class="col-lg-10 col-md-12 main-content px-3 py-3">
        <!-- Loading skeleton -->
        <div *ngIf="loading">
          <div class="card p-4 mb-3">
            <div class="d-flex align-items-center gap-3">
              <div class="skeleton" style="width:96px;height:96px;border-radius:50%;"></div>
              <div class="flex-grow-1">
                <div class="skeleton skeleton-text" style="width:40%"></div>
                <div class="skeleton skeleton-text" style="width:25%"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Profile content -->
        <div *ngIf="!loading && user">
          <!-- Profile header card -->
          <div class="card mb-3">
            <div class="profile-cover"></div>
            <div class="card-body pt-0">
              <div class="d-flex flex-wrap align-items-end justify-content-between gap-3" style="margin-top: -48px;">
                <div class="d-flex align-items-end gap-3">
                  <app-avatar
                    [image]="user.profileImage"
                    [name]="user.fullName"
                    size="2xl"
                    style="border: 4px solid var(--card);"
                  ></app-avatar>
                  <div class="pb-2">
                    <h4 class="fw-bold mb-0">{{ user.fullName }}</h4>
                    <p class="text-muted mb-0">@{{ user.username }}</p>
                  </div>
                </div>
                <div class="d-flex gap-2 pb-2">
                  <button *ngIf="isOwnProfile" class="btn btn-outline btn-sm" routerLink="/settings">
                    <i class="bi bi-pencil"></i> Edit Profile
                  </button>
                  <button *ngIf="!isOwnProfile && !user.isFollowing" class="btn btn-primary btn-sm" (click)="followUser()">
                    <i class="bi bi-person-plus"></i> Follow
                  </button>
                  <button *ngIf="!isOwnProfile && user.isFollowing" class="btn btn-outline btn-sm" (click)="unfollowUser()">
                    <i class="bi bi-person-check"></i> Following
                  </button>
                  <button *ngIf="!isOwnProfile" class="btn btn-secondary btn-sm" (click)="sendMessage()">
                    <i class="bi bi-chat-dots"></i> Message
                  </button>
                </div>
              </div>

              <p class="mt-3 mb-2" *ngIf="user.bio">{{ user.bio }}</p>

              <div class="d-flex gap-4">
                <span><strong>{{ posts.length }}</strong> <span class="text-muted">Posts</span></span>
                <span><strong>{{ user.followersCount }}</strong> <span class="text-muted">Followers</span></span>
                <span><strong>{{ user.followingCount }}</strong> <span class="text-muted">Following</span></span>
              </div>
            </div>
          </div>

          <!-- Tabs -->
          <div class="card">
            <div class="d-flex border-bottom">
              <button
                class="btn btn-ghost flex-grow-1"
                [class.active]="activeTab === 'posts'"
                (click)="activeTab = 'posts'"
                style="border-radius: 0; border-bottom: 2px solid var(--primary);"
              >
                <i class="bi bi-grid me-2"></i>Posts
              </button>
            </div>

            <!-- Posts grid -->
            <div class="p-3">
              <div *ngIf="postsLoading">
                <app-skeleton type="post"></app-skeleton>
              </div>

              <app-empty-state
                *ngIf="!postsLoading && posts.length === 0"
                icon="bi-grid"
                title="No posts yet"
                description="When {{ user.fullName }} posts, you will see it here."
              ></app-empty-state>

              <div *ngIf="!postsLoading && posts.length > 0">
                <app-post-card
                  *ngFor="let post of posts"
                  [post]="post"
                  (postDeleted)="onPostDeleted($event)"
                  (postUpdated)="onPostUpdated($event)"
                ></app-post-card>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <app-mobile-nav></app-mobile-nav>
</div>
